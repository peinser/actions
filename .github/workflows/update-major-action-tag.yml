name: Update major action tag

on:
  push:
    tags:
      - "v*.*.*"

permissions:
  contents: write

jobs:
  update-major:
    runs-on: ubuntu-latest
    steps:
      - name: Checkout repository
        uses: actions/checkout@v4

      - name: Validate release tag format
        run: |
          set -euo pipefail
          tag="${GITHUB_REF_NAME}"
          if [[ ! "${tag}" =~ ^v[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "Expected SemVer tag like v1.2.3, got ${tag}" >&2
            exit 1
          fi

      - name: Validate VERSION file
        run: |
          set -euo pipefail

          if [ ! -f VERSION ]; then
            echo "VERSION file is missing at repository root." >&2
            exit 1
          fi

          version="$(tr -d '[:space:]' < VERSION)"
          tag_version="${GITHUB_REF_NAME#v}"

          if [[ ! "${version}" =~ ^[0-9]+\.[0-9]+\.[0-9]+$ ]]; then
            echo "VERSION must be SemVer MAJOR.MINOR.PATCH, got '${version}'." >&2
            exit 1
          fi

          if [ "${version}" != "${tag_version}" ]; then
            echo "VERSION (${version}) does not match release tag (${tag_version})." >&2
            exit 1
          fi

      - name: Update major tag
        uses: actions/github-script@v7
        with:
          github-token: ${{ secrets.GITHUB_TOKEN }}
          script: |
            const releaseTag = process.env.GITHUB_REF_NAME;
            const majorTag = `v${releaseTag.slice(1).split('.')[0]}`;
            const owner = context.repo.owner;
            const repo = context.repo.repo;

            const releaseRef = await github.rest.git.getRef({
              owner,
              repo,
              ref: `tags/${releaseTag}`
            });

            const sha = releaseRef.data.object.sha;

            const refName = `tags/${majorTag}`;
            let majorRefExists = true;

            try {
              await github.rest.git.getRef({ owner, repo, ref: refName });
            } catch (error) {
              if (error.status === 404) {
                majorRefExists = false;
              } else {
                throw error;
              }
            }

            if (majorRefExists) {
              await github.rest.git.updateRef({
                owner,
                repo,
                ref: refName,
                sha,
                force: true
              });
              core.info(`Updated ${majorTag} -> ${sha}`);
            } else {
              await github.rest.git.createRef({
                owner,
                repo,
                ref: `refs/${refName}`,
                sha
              });
              core.info(`Created ${majorTag} -> ${sha}`);
            }
